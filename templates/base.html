<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Aplicação Flask{% endblock %}
    </title>

    <!-- ✅ CORRIGIDO: agora aponta para a pasta css/ -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <header class="navbar">

        <div class="navbar-container">

            <div class="logo">
                Aplicação Flask
            </div>


            <nav class="menu">

                <a
                    href="{{ url_for('home') }}"
                    class="{% if request.endpoint == 'home' %}ativo{% endif %}"
                >
                    Home
                </a>

                <a
                    href="{{ url_for('login') }}"
                    class="{% if request.endpoint == 'login' %}ativo{% endif %}"
                >
                    Login
                </a>

                <a
                    href="{{ url_for('identificacao') }}"
                    class="{% if request.endpoint == 'identificacao' %}ativo{% endif %}"
                >
                    Identificação
                </a>

                <a
                    href="{{ url_for('contexto') }}"
                    class="{% if request.endpoint == 'contexto' %}ativo{% endif %}"
                >
                    Contexto
                </a>

            </nav>

        </div>

    </header>


    <main class="conteudo">

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <div class="footer-container">

            <div>
                <strong>Última atualização</strong>

                <br>

                {{ horario if horario else '' }}

            </div>


            <div>
                Washington - IFSP Pirituba
            </div>

        </div>

    </footer>

</body>

</html>
