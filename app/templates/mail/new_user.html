<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo usuário cadastrado</title>
</head>

<body>
    <h2>Novo usuário cadastrado</h2>

    <p>Um novo usuário foi cadastrado na aplicação Flask.</p>

    <p>
        <strong>Usuário cadastrado:</strong>
        {{ user.username }}
    </p>

    <p>
        <strong>Prontuário:</strong>
        {{ prontuario }}
    </p>

    <p>
        <strong>Nome do aluno:</strong>
        {{ aluno }}
    </p>

    <p>
        A mensagem corresponde ao cadastro de {{ user.username }}.
    </p>
</body>
</html>
